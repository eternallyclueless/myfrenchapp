name: AI Repository Inspector

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get Changed Code (Git Diff)
        id: diff
        run: |
          DIFF=$(git diff HEAD~1 HEAD)
          if [ -z "$DIFF" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "$DIFF" > diff.txt
          fi

      - name: Set up Node.js
        if: steps.diff.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Google Gen AI SDK
        if: steps.diff.outputs.has_changes == 'true'
        run: npm install @google/genai

      - name: Run Gemini Review
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node -e '
          import { GoogleGenAI } from "@google/genai";
          import fs from "fs";

          const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });
          const diff = fs.readFileSync("diff.txt", "utf8");

          async function checkDiff() {
            const prompt = `You are an expert code reviewer and JSON validator.
            Review the following git diff for errors:
            - Broken JSON syntax (like duplicate brackets "][", missing commas, trailing commas).
            - JavaScript bugs or typos.
            - Malformed HTML/CSS.
            - Vocabulary inconsistencies (missing id, fr, en, category).

            If there are errors, explain clearly where they are and how to fix them.
            If everything is clean and valid, respond with "✅ No errors found."

            Git Diff:
            \n\n${diff}`;

            const models = ["gemini-3.6-flash", "gemini-2.5-flash"];
            let response = null;

            for (const model of models) {
              try {
                console.log(`Attempting audit with ${model}...`);
                response = await ai.models.generateContent({
                  model: model,
                  contents: prompt,
                });
                if (response?.text) break;
              } catch (err) {
                console.warn(`Model ${model} unavailable (${err?.status || err?.message}). Trying next...`);
              }
            }

            console.log("\n================ GEMINI CODE AUDIT ================\n");
            if (response && response.text) {
              console.log(response.text);
            } else {
              console.log("⚠️ Gemini API is temporarily at capacity across available models. Diff inspection skipped for this commit.");
            }
            console.log("\n===================================================\n");
          }

          checkDiff();
          '
